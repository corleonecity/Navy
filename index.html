<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>U.S Navy Marine - Verwaltungssystem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        /* ===== ALLGEMEINE RESETS ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; min-height: 100%; margin: 0; padding: 0; background: #000000; color: #f2f5f8; font-family: Arial, Helvetica, sans-serif; overflow-x: hidden; }

        /* ===== LOGIN ===== */
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 999; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); }
        #loginScreen.hidden { display: none; }
        .login-box { position: relative; overflow: hidden; max-width: 430px; width: 92%; padding: 38px 36px; background: #000000; border: 1px solid #272727; border-top: 3px solid #1f6feb; border-radius: 14px; box-shadow: 0 24px 70px rgba(0,0,0,0.95), 0 0 24px rgba(31,111,235,0.1); text-align: center; }
        .login-box::after { content: ""; position: absolute; left: -38%; bottom: 0; width: 38%; height: 2px; background: linear-gradient(90deg, transparent, #3b82f6, transparent); box-shadow: 0 0 12px rgba(59,130,246,0.75); animation: lineMove 6s linear infinite; }
        @keyframes lineMove { from { left: -38%; } to { left: 110%; } }
        .login-box img { width: 110px; margin-bottom: 16px; filter: drop-shadow(0 0 20px rgba(59,130,246,0.3)); }
        .login-box h2 { color: #d3212d; font-family: Impact, "Arial Narrow", Arial, sans-serif; font-size: 28px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 20px rgba(211,33,45,0.2); }
        .login-box .sub { color: #8f9499; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 24px; }
        .login-box input { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #303030; background: #050505; color: #ffffff; font-size: 15px; outline: none; transition: all 0.3s ease; margin-bottom: 10px; }
        .login-box input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .login-box .input-with-suggest { position: relative; }
        .login-box .suggest-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #050505; border: 1px solid #303030; border-top: none; border-radius: 0 0 8px 8px; max-height: 150px; overflow-y: auto; z-index: 100; display: none; }
        .login-box .suggest-dropdown.show { display: block; }
        .login-box .suggest-dropdown div { padding: 10px 16px; cursor: pointer; color: #e5e7eb; border-bottom: 1px solid #171717; text-align: left; transition: 0.2s; }
        .login-box .suggest-dropdown div:hover { background: #0a1628; color: #ffffff; }
        .btn-login { width: 100%; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 16px; letter-spacing: 1.5px; text-transform: uppercase; background: #050505; border: 2px solid #1f6feb; color: #ffffff; transition: all 0.3s ease; margin-top: 4px; }
        .btn-login:hover { background: #0a1628; border-color: #3b82f6; box-shadow: 0 0 25px rgba(59,130,246,0.2); transform: translateY(-2px); }
        .login-error { color: #ff4b55; font-size: 13px; margin-top: 10px; display: none; }
        .login-error.show { display: block; }
        .login-version { margin-top: 16px; color: #62676c; font-size: 11px; opacity: 0.5; letter-spacing: 1px; }

        /* ===== MAIN APP ===== */
        #mainApp { display: none; width: 100%; min-height: 100vh; background: #000000; }
        #mainApp.show { display: block; }
        .container { position: relative; width: min(96%, 1450px) !important; max-height: 94vh !important; margin: 3vh auto !important; overflow: hidden auto !important; background: #000000 !important; border: 1px solid #272727 !important; border-top: 3px solid #1f6feb !important; border-radius: 12px !important; box-shadow: 0 22px 65px rgba(0,0,0,0.95), 0 0 24px rgba(31,111,235,0.08) !important; display: flex; flex-direction: column; }
        .container::before { content: ""; position: absolute; z-index: 20; top: 0; left: -32%; width: 32%; height: 2px; pointer-events: none; background: linear-gradient(90deg, transparent, #3b82f6, transparent); box-shadow: 0 0 12px rgba(59,130,246,0.70); animation: lineMove2 8s linear infinite; }
        @keyframes lineMove2 { from { left: -32%; } to { left: 110%; } }

        /* ===== TOP BAR ===== */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #000000; border-bottom: 1px solid #272727; flex-wrap: wrap; gap: 8px; position: sticky; top: 0; z-index: 30; }
        .top-bar .brand { display: flex; align-items: center; gap: 10px; color: #d3212d; font-family: Impact, "Arial Narrow", Arial, sans-serif; font-size: 20px; font-weight: 400; letter-spacing: 1px; text-shadow: 0 0 15px rgba(211,33,45,0.15); }
        .top-bar .brand .badge-version { font-size: 10px; color: #62676c; background: #080808; padding: 2px 8px; border-radius: 10px; border: 1px solid #272727; font-family: Arial, sans-serif; }
        .top-bar .user-info { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .top-bar .user-badge { padding: 4px 14px; border-radius: 6px; font-size: 12px; font-weight: 700; background: rgba(31,111,235,0.12); border: 1px solid #1f6feb; color: #3b82f6; }
        .top-bar .user-badge.admin { background: rgba(211,33,45,0.12); border-color: #d3212d; color: #ef3340; }
        .btn-logout { padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 12px; background: #080808; border: 1px solid #333333; color: #d7dce2; transition: all 0.3s ease; }
        .btn-logout:hover { border-color: #d3212d; background: rgba(211,33,45,0.1); color: #ffffff; }

        /* ===== TAB NAVIGATION ===== */
        .tab-nav { display: flex; gap: 4px; padding: 10px 16px 0 16px; background: #000000; border-bottom: 1px solid #262626; flex-shrink: 0; flex-wrap: wrap; overflow-x: auto; position: sticky; top: 60px; z-index: 29; }
        .tab-btn { padding: 10px 18px; border-radius: 8px 8px 0 0; cursor: pointer; font-weight: 600; font-size: 13px; letter-spacing: 0.3px; background: transparent; border: 1px solid transparent; border-bottom: none; color: #969da5; transition: all 0.3s ease; position: relative; top: 1px; white-space: nowrap; }
        .tab-btn:hover { color: #ffffff; background: rgba(255,255,255,0.05); }
        .tab-btn.active { color: #ffffff; background: #07111f; border-color: #1f6feb; border-bottom: 3px solid #3b82f6; box-shadow: 0 -3px 15px rgba(59,130,246,0.12); }
        .tab-btn.admin-tab.active { border-color: #d3212d; border-bottom-color: #ef3340; background: #140305; }
        .tab-btn .tab-icon { margin-right: 6px; }

        /* ===== TAB CONTENT ===== */
        .tab-content { display: none !important; padding: 22px !important; flex: 1; overflow-y: auto; background: #000000; min-height: 50vh; }
        .tab-content.active { display: block !important; }

        /* ===== BUTTONS ===== */
        button { padding: 10px 20px; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: 14px; background: #070707; border: 1px solid #343434; color: #ffffff; transition: all 0.3s ease; white-space: nowrap; }
        button:hover { background: #0a1628; border-color: #3b82f6; box-shadow: 0 0 13px rgba(59,130,246,0.15); transform: translateY(-2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
        .btn-primary { background: #1f6feb; border-color: #1f6feb; color: white; }
        .btn-primary:hover { background: #3b82f6; border-color: #3b82f6; }
        .btn-success { background: #22c55e; border-color: #22c55e; color: white; }
        .btn-success:hover { background: #16a34a; border-color: #16a34a; }
        .btn-danger { background: #d3212d; border-color: #d3212d; color: white; }
        .btn-danger:hover { background: #ef3340; border-color: #ef3340; }
        .btn-gold { background: #ffaa33; border-color: #ffaa33; color: #000000; }
        .btn-gold:hover { background: #f59e0b; border-color: #f59e0b; }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        .btn-xs { padding: 3px 10px; font-size: 11px; border-radius: 4px; }

        /* ===== INPUTS ===== */
        input, textarea, select { padding: 10px 12px; border-radius: 8px; border: 1px solid #303030; background: #050505; color: #ffffff; font-size: 14px; outline: none; transition: all 0.3s ease; }
        input:focus, textarea:focus, select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        select option { background: #0a1220; color: white; }

        /* ===== HAUPTSEITE ===== */
        .homepage { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 55vh; text-align: center; padding: 30px 20px; background: #000000; border: 1px solid #272727; border-radius: 10px; position: relative; overflow: hidden; }
        .homepage::after { content: ""; position: absolute; bottom: 0; left: -35%; width: 35%; height: 2px; background: linear-gradient(90deg, transparent, #3b82f6, transparent); box-shadow: 0 0 12px rgba(59,130,246,0.70); animation: lineMove3 7s linear infinite; }
        @keyframes lineMove3 { from { left: -35%; } to { left: 110%; } }
        .homepage img { width: 175px !important; margin-bottom: 20px; filter: drop-shadow(0 10px 12px rgba(0,0,0,0.95)) drop-shadow(0 0 16px rgba(59,130,246,0.42)) !important; animation: logoFloat 5s ease-in-out infinite; }
        @keyframes logoFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        .homepage h1 { color: #d3212d !important; font-family: Impact, "Arial Narrow", Arial, sans-serif !important; font-size: clamp(38px, 5vw, 64px) !important; font-weight: 400 !important; letter-spacing: 2px !important; text-shadow: 0 0 18px rgba(211,33,45,0.30) !important; }
        .homepage .subtitle { color: #a9b0b7 !important; font-size: 1.1rem; letter-spacing: 3px !important; text-transform: uppercase; margin-bottom: 10px; }
        .homepage .welcome-user { color: #3b82f6; font-size: 18px; margin-top: 4px; }

        /* ===== HANDBOOK ===== */
        .handbook-section { background: #030303; border: 1px solid #292929; border-left: 3px solid #1f6feb; border-radius: 9px; padding: 20px; margin-top: 20px; text-align: left; width: 100%; max-width: 800px; }
        .handbook-section h3 { color: #ffaa33; font-size: 18px; border-bottom: 1px solid #292929; padding-bottom: 10px; margin-bottom: 14px; }
        .handbook-section .handbook-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 600px) { .handbook-section .handbook-grid { grid-template-columns: 1fr; } }
        .handbook-section .category-card { background: #050505; border: 1px solid #292929; border-radius: 8px; padding: 14px; border-left: 3px solid #1f6feb; }
        .handbook-section .category-card .cat-icon { font-size: 20px; margin-right: 8px; }
        .handbook-section .category-card .cat-name { font-weight: 700; font-size: 15px; color: #ffffff; }
        .handbook-section .category-card .cat-desc { font-size: 13px; color: #8f9499; margin-top: 4px; line-height: 1.4; }

        /* ===== TOAST ===== */
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; max-width: 400px; }
        .toast { padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; color: white; box-shadow: 0 8px 32px rgba(0,0,0,0.6); animation: slideIn 0.3s ease; display: flex; align-items: center; gap: 10px; }
        .toast.success { background: #22c55e; }
        .toast.error { background: #ef3340; }
        .toast.warning { background: #ffaa33; color: #000000; }
        .toast.info { background: #3b82f6; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* ===== CONFIRM MODAL ===== */
        .confirm-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .confirm-modal-overlay.show { display: flex; }
        .confirm-modal { background: #0a0a0a; border: 1px solid #303030; border-top: 3px solid #d3212d; border-radius: 12px; padding: 28px 32px; width: 95%; max-width: 420px; box-shadow: 0 24px 60px rgba(0,0,0,0.95); text-align: center; }
        .confirm-modal .confirm-icon { font-size: 48px; color: #ffaa33; margin-bottom: 12px; }
        .confirm-modal h3 { color: #ffffff; font-size: 20px; margin-bottom: 8px; border-bottom: none; }
        .confirm-modal p { color: #8f9499; font-size: 14px; margin-bottom: 20px; }
        .confirm-modal .confirm-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .confirm-modal .confirm-actions button { min-width: 100px; padding: 10px 24px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; border: none; transition: all 0.3s ease; }
        .confirm-modal .confirm-actions .btn-confirm-yes { background: #d3212d; color: white; }
        .confirm-modal .confirm-actions .btn-confirm-yes:hover { background: #ef3340; transform: scale(1.03); }
        .confirm-modal .confirm-actions .btn-confirm-no { background: #1a1a1a; color: #e5e7eb; border: 1px solid #444; }
        .confirm-modal .confirm-actions .btn-confirm-no:hover { background: #2a2a2a; transform: scale(1.03); }

        /* ===== UTILITY ===== */
        .text-muted { color: #8f9499; }
        .text-gold { color: #ffaa33; }
        .text-green { color: #22c55e; }
        .text-red { color: #ef3340; }
        .text-blue { color: #3b82f6; }
        .hidden { display: none !important; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .container { width: 100% !important; min-height: 100vh; max-height: 100vh !important; margin: 0 !important; border-radius: 0 !important; border-left: none !important; border-right: none !important; border-bottom: none !important; }
            .top-bar { flex-direction: column; align-items: stretch; gap: 4px; }
            .top-bar .user-info { justify-content: center; }
            .tab-nav { padding: 8px 12px 0 12px; overflow-x: auto; flex-wrap: nowrap; gap: 2px; }
            .tab-btn { padding: 8px 12px; font-size: 11px; }
            .tab-content { padding: 12px !important; }
            .homepage h1 { font-size: 28px !important; }
            .homepage img { width: 135px !important; }
            .handbook-section .handbook-grid { grid-template-columns: 1fr; }
            .confirm-modal { padding: 20px; max-width: 95%; }
        }
    </style>
</head>
<body>

    <!-- ===== LOGIN SCREEN ===== -->
    <div id="loginScreen">
        <div class="login-box">
            <img src="https://cdn.phototourl.com/free/2026-07-09-c1b8a06d-a213-4a8a-a938-ef9afda7bba5.png" alt="Navy Logo">
            <h2>U.S NAVY MARINE</h2>
            <p class="sub">⚓ Verwaltungssystem ⚓</p>
            <div class="input-with-suggest">
                <input type="text" id="loginUsername" placeholder="Benutzername" autocomplete="off" oninput="showSuggestions(this.value)">
                <div class="suggest-dropdown" id="suggestDropdown"></div>
            </div>
            <input type="password" id="loginPassword" placeholder="Passwort" onkeydown="if(event.key==='Enter') doLogin()">
            <button class="btn-login" id="loginBtn" onclick="doLogin()"><i class="fas fa-lock"></i> Anmelden</button>
            <p class="login-error" id="loginError">❌ Falscher Benutzername oder Passwort!</p>
            <div class="login-version">v2.0 • ADMIN / USER</div>
        </div>
    </div>

    <!-- ===== MAIN APP ===== -->
    <div id="mainApp">
        <div class="container">

            <!-- TOP BAR -->
            <div class="top-bar">
                <div class="brand">
                    <span>⚓ U.S NAVY MARINE</span>
                    <span class="badge-version">v2.0</span>
                </div>
                <div class="user-info">
                    <span id="currentUserDisplay" style="font-size:14px;color:#d9ecff;"></span>
                    <span class="user-badge" id="userBadge">User</span>
                    <button class="btn-logout" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> Abmelden</button>
                </div>
            </div>

            <!-- TAB NAV -->
            <div class="tab-nav" id="tabNav"></div>

            <!-- TABS -->
            <div id="tab-home" class="tab-content active"></div>
            <div id="tab-stopwatch" class="tab-content"></div>
            <div id="tab-interessenten" class="tab-content"></div>
            <div id="tab-confiscations" class="tab-content"></div>
            <div id="tab-payout" class="tab-content"></div>
            <div id="tab-elk" class="tab-content"></div>
            <div id="tab-logs" class="tab-content"></div>
            <div id="tab-admin" class="tab-content"></div>

        </div>
    </div>

    <!-- ===== CONFIRM MODAL ===== -->
    <div class="confirm-modal-overlay" id="confirmModalOverlay">
        <div class="confirm-modal">
            <div class="confirm-icon">⚠️</div>
            <h3 id="confirmModalTitle">Sind Sie sicher?</h3>
            <p id="confirmModalMessage">Diese Aktion kann nicht rückgängig gemacht werden.</p>
            <div class="confirm-actions">
                <button class="btn-confirm-yes" id="confirmModalYesBtn">Ja, löschen</button>
                <button class="btn-confirm-no" id="confirmModalNoBtn">Abbrechen</button>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== SCRIPTS ===== -->
    <script>
        // =====================================================================
        // FIREBASE KONFIGURATION
        // =====================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyB7AmLb6NwR8sKyDXtIhmghGszpX_VsICY",
            authDomain: "cc-shop-36c3b.firebaseapp.com",
            databaseURL: "https://cc-shop-36c3b-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "cc-shop-36c3b",
            storageBucket: "cc-shop-36c3b.firebasestorage.app",
            messagingSenderId: "376170741825",
            appId: "1:376170741825:web:bc6102e277da5ad7cbc6c0"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // =====================================================================
        // GLOBALE VARIABLEN
        // =====================================================================
        let currentUser = null;
        let isAdmin = false;
        let userRole = 'admin';
        let userPermissions = {
            stopwatch: { view: 'read', create: 'write', delete: 'write' },
            interessenten: { view: 'read', create: 'write', archive: 'write', delete: 'write' },
            confiscations: { view: 'read', create: 'write', edit: 'write', delete: 'write' },
            payout: { view: 'read', edit: 'write' },
            logs: { view: 'read' },
            elk: { view: 'read', edit: 'write' },
            admin: 'write'
        };
        const SESSION_DURATION = 30 * 60 * 1000;
        const BLOCKED_USER = 'colin';
        const EDIT_TIMEOUT = 2 * 60 * 60 * 1000;

        let sessionTimeout = null;
        let userDataListener = null;
        let allUsernames = [];
        let userDisplayNames = {};
        let confirmCallback = null;

        // =====================================================================
        // ROLLEN
        // =====================================================================
        let ROLE_DEFS = {};
        function initDefaultRoles() {
            ROLE_DEFS = {
                'admin': {
                    label: 'Admin',
                    icon: '🔑',
                    color: '#ef3340',
                    permissions: {
                        stopwatch: { view: 'read', create: 'write', delete: 'write' },
                        interessenten: { view: 'read', create: 'write', archive: 'write', delete: 'write' },
                        confiscations: { view: 'read', create: 'write', edit: 'write', delete: 'write' },
                        payout: { view: 'read', edit: 'write' },
                        logs: { view: 'read' },
                        elk: { view: 'read', edit: 'write' },
                        admin: 'write'
                    }
                }
            };
        }
        initDefaultRoles();

        // =====================================================================
        // HELPER FUNKTIONEN
        // =====================================================================
        function getDisplayName(username) {
            if (!username) return 'Unbekannt';
            return username.charAt(0).toUpperCase() + username.slice(1);
        }

        function esc(s) {
            if (!s) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatNumber(n) {
            if (n === null || n === undefined || isNaN(n)) return '0';
            return Number(n).toLocaleString('de-DE');
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = 'toast ' + type;
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            el.innerHTML = (icons[type] || 'ℹ️') + ' ' + msg;
            container.appendChild(el);
            setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3500);
        }

        // =====================================================================
        // CONFIRM MODAL
        // =====================================================================
        function showConfirmModal(title, message, onConfirm) {
            document.getElementById('confirmModalTitle').textContent = title || 'Sind Sie sicher?';
            document.getElementById('confirmModalMessage').textContent = message || 'Diese Aktion kann nicht rückgängig gemacht werden.';
            confirmCallback = onConfirm || null;
            document.getElementById('confirmModalOverlay').classList.add('show');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModalOverlay').classList.remove('show');
            confirmCallback = null;
        }

        document.getElementById('confirmModalYesBtn').addEventListener('click', function() {
            if (typeof confirmCallback === 'function') { confirmCallback(); }
            closeConfirmModal();
        });
        document.getElementById('confirmModalNoBtn').addEventListener('click', function() { closeConfirmModal(); });
        document.getElementById('confirmModalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeConfirmModal();
        });

        // =====================================================================
        // SESSION MANAGEMENT
        // =====================================================================
        function saveSession(username, isAdminUser, permissions, role) {
            localStorage.setItem('navySession', JSON.stringify({
                username: username,
                isAdmin: isAdminUser,
                permissions: permissions,
                role: role || 'admin',
                expiry: Date.now() + SESSION_DURATION
            }));
        }

        function loadSession() {
            const sessionStr = localStorage.getItem('navySession');
            if (!sessionStr) return null;
            try {
                const data = JSON.parse(sessionStr);
                if (Date.now() > data.expiry) { localStorage.removeItem('navySession'); return null; }
                data.expiry = Date.now() + SESSION_DURATION;
                localStorage.setItem('navySession', JSON.stringify(data));
                return data;
            } catch { localStorage.removeItem('navySession'); return null; }
        }

        function clearSession() { localStorage.removeItem('navySession'); }

        // =====================================================================
        // LOGGING
        // =====================================================================
        async function addLog(username, action, details = '') {
            try {
                await database.ref('Navy-boote/logs').push({
                    username: username,
                    action: action,
                    details: details,
                    timestamp: Date.now(),
                    date: new Date().toISOString()
                });
            } catch (error) { console.error('Fehler beim Logging:', error); }
        }

        async function cleanupOldLogs() {
            try {
                const cutoff = Date.now() - (7 * 24 * 60 * 60 * 1000);
                const snap = await database.ref('Navy-boote/logs').once('value');
                const logs = snap.val();
                if (!logs) return;
                const updates = {};
                for (const [key, log] of Object.entries(logs)) {
                    if (log.timestamp && log.timestamp < cutoff) updates[key] = null;
                }
                if (Object.keys(updates).length > 0) {
                    await database.ref('Navy-boote/logs').update(updates);
                }
            } catch (error) { console.error('Fehler beim Log-Cleanup:', error); }
        }

        // =====================================================================
        // ROLLEN AUS FIREBASE LADEN
        // =====================================================================
        async function loadRolesFromFirebase() {
            try {
                const snap = await database.ref('Navy-boote/roles').once('value');
                const data = snap.val();
                if (data && typeof data === 'object') {
                    for (const [key, perms] of Object.entries(data)) {
                        if (ROLE_DEFS[key]) {
                            ROLE_DEFS[key].permissions = perms;
                        } else {
                            ROLE_DEFS[key] = {
                                label: key.charAt(0).toUpperCase() + key.slice(1),
                                icon: '🎖️',
                                color: '#3b82f6',
                                permissions: perms
                            };
                        }
                    }
                }
            } catch (error) { console.error('Fehler beim Laden der Rollen:', error); }
        }

        // =====================================================================
        // LOGIN SUGGESTIONS
        // =====================================================================
        async function updateAllUsernameLists() {
            try {
                const snap = await database.ref('Navy-boote/users_auth').once('value');
                const users = snap.val() || {};
                allUsernames = [];
                userDisplayNames = {};
                for (const [key] of Object.entries(users)) {
                    if (key === BLOCKED_USER) continue;
                    const displayName = getDisplayName(key);
                    allUsernames.push(displayName);
                    userDisplayNames[displayName] = key;
                }
            } catch (error) { console.error('Fehler beim Aktualisieren der Benutzernamen:', error); }
        }

        function showSuggestions(value) {
            const dropdown = document.getElementById('suggestDropdown');
            if (!value || value.length < 1) { dropdown.classList.remove('show'); return; }
            const val = value.toLowerCase();
            const matches = allUsernames.filter(name => name.toLowerCase().includes(val));
            if (matches.length === 0) { dropdown.classList.remove('show'); return; }
            dropdown.innerHTML = '';
            matches.forEach(name => {
                const div = document.createElement('div');
                div.textContent = name;
                div.onclick = () => {
                    document.getElementById('loginUsername').value = name;
                    dropdown.classList.remove('show');
                };
                dropdown.appendChild(div);
            });
            dropdown.classList.add('show');
        }

        // =====================================================================
        // LOGIN
        // =====================================================================
        let loginAttempts = {};

        async function doLogin() {
            const usernameInput = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            let username = usernameInput.toLowerCase();
            if (userDisplayNames[usernameInput]) username = userDisplayNames[usernameInput];
            username = username.toLowerCase();

            if (username === BLOCKED_USER) {
                document.getElementById('loginError').textContent = '❌ Dieser Benutzername ist gesperrt!';
                document.getElementById('loginError').classList.add('show');
                document.getElementById('loginPassword').value = '';
                try { await database.ref('Navy-boote/users_auth/colin').remove(); } catch (e) {}
                return;
            }

            if (!username || !password) {
                document.getElementById('loginError').textContent = '❌ Bitte Benutzername und Passwort eingeben!';
                document.getElementById('loginError').classList.add('show');
                return;
            }

            const now = Date.now();
            const attempts = loginAttempts[username] || [];
            const recent = attempts.filter(t => now - t < 60000);
            if (recent.length >= 5) {
                document.getElementById('loginError').textContent = '❌ Zu viele Fehlversuche. Bitte warte 1 Minute.';
                document.getElementById('loginError').classList.add('show');
                return;
            }

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Anmelden...';

            try {
                const snap = await database.ref('Navy-boote/users_auth/' + username).once('value');
                const userData = snap.val();
                if (userData && userData.password === password) {
                    loginAttempts[username] = [];
                    await completeLogin(username, userData);
                } else {
                    recent.push(now);
                    loginAttempts[username] = recent;
                    document.getElementById('loginError').textContent = '❌ Falscher Benutzername oder Passwort!';
                    document.getElementById('loginError').classList.add('show');
                    document.getElementById('loginPassword').value = '';
                }
            } catch (error) {
                console.error('Login-Fehler:', error);
                showToast('❌ Fehler bei der Anmeldung!', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-lock"></i> Anmelden';
            }
        }

        async function completeLogin(username, userData) {
            await loadRolesFromFirebase();

            const role = userData.role || 'admin';
            const roleDef = ROLE_DEFS[role] || ROLE_DEFS['admin'];
            const perms = userData.permissions || roleDef.permissions || {};

            userPermissions = { ...roleDef.permissions, ...perms };
            isAdmin = userPermissions.admin === 'write';
            userRole = role;
            currentUser = { username: username, isAdmin: isAdmin, role: role };

            saveSession(username, isAdmin, userPermissions, role);
            showMainApp(username);
            startUserDataListener(username);
            startSessionTimer();
            updateTabs();
            await addLog(username, 'Login', 'Benutzer hat sich angemeldet');
            switchTab('home');
        }

        function startUserDataListener(username) {
            if (userDataListener) userDataListener.off();
            userDataListener = database.ref('Navy-boote/users_auth/' + username);
            userDataListener.on('value', async (snap) => {
                const userData = snap.val();
                if (!userData) {
                    showToast('⚠️ Dein Account wurde gelöscht!', 'warning');
                    setTimeout(() => doLogout(), 1500);
                    return;
                }
                await loadRolesFromFirebase();
                const newRole = userData.role || 'admin';
                const roleDef = ROLE_DEFS[newRole] || ROLE_DEFS['admin'];
                let newPerms = { ...roleDef.permissions };
                if (userData.permissions) newPerms = { ...newPerms, ...userData.permissions };

                userPermissions = newPerms;
                userRole = newRole;
                isAdmin = userPermissions.admin === 'write';

                if (currentUser) {
                    currentUser.role = newRole;
                    currentUser.isAdmin = isAdmin;
                    saveSession(currentUser.username, isAdmin, userPermissions, newRole);
                    updateUserBadge();
                    updateTabs();

                    const currentTab = document.querySelector('.tab-content.active');
                    if (currentTab) {
                        const tabId = currentTab.id.replace('tab-', '');
                        if (tabId !== 'home' && tabId !== 'admin') {
                            const permLevel = userPermissions[tabId] || 'none';
                            if (permLevel === 'none') switchTab('home');
                        }
                    }
                    showToast('🔄 Berechtigungen aktualisiert', 'info');
                }
            });
        }

        async function tryAutoLogin() {
            const sessionData = loadSession();
            if (!sessionData) return false;
            try {
                await loadRolesFromFirebase();
                const snap = await database.ref('Navy-boote/users_auth/' + sessionData.username).once('value');
                const userData = snap.val();
                if (!userData) { clearSession(); return false; }

                const role = userData.role || 'admin';
                const roleDef = ROLE_DEFS[role] || ROLE_DEFS['admin'];
                const perms = userData.permissions || roleDef.permissions || {};
                userPermissions = { ...roleDef.permissions, ...perms };
                isAdmin = userPermissions.admin === 'write';
                userRole = role;
                currentUser = { username: sessionData.username, isAdmin: isAdmin, role: role };

                showMainApp(sessionData.username);
                startUserDataListener(sessionData.username);
                startSessionTimer();
                updateTabs();
                switchTab('home');
                return true;
            } catch (error) {
                console.error('Auto-Login Fehler:', error);
                clearSession();
                return false;
            }
        }

        function showMainApp(username) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.add('show');
            document.getElementById('currentUserDisplay').textContent = '👤 ' + getDisplayName(username);
            document.getElementById('welcomeName').textContent = getDisplayName(username);
            updateUserBadge();
            document.getElementById('loginError').classList.remove('show');
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginUsername').value = '';
            document.getElementById('suggestDropdown').classList.remove('show');
        }

        function updateUserBadge() {
            const badge = document.getElementById('userBadge');
            const roleDef = ROLE_DEFS[userRole] || ROLE_DEFS['admin'];
            badge.textContent = roleDef.icon + ' ' + roleDef.label;
            badge.className = 'user-badge';
            if (userRole === 'admin') badge.classList.add('admin');
        }

        function doLogout() {
            if (currentUser) addLog(currentUser.username, 'Logout', 'Benutzer hat sich abgemeldet');
            clearSession();
            if (sessionTimeout) { clearTimeout(sessionTimeout);
                sessionTimeout = null; }
            if (userDataListener) { userDataListener.off();
                userDataListener = null; }
            currentUser = null;
            isAdmin = false;
            userRole = 'admin';
            userPermissions = {
                stopwatch: { view: 'read', create: 'write', delete: 'write' },
                interessenten: { view: 'read', create: 'write', archive: 'write', delete: 'write' },
                confiscations: { view: 'read', create: 'write', edit: 'write', delete: 'write' },
                payout: { view: 'read', edit: 'write' },
                logs: { view: 'read' },
                elk: { view: 'read', edit: 'write' },
                admin: 'write'
            };
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('mainApp').classList.remove('show');
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginUsername').value = '';
            document.getElementById('suggestDropdown').classList.remove('show');
            document.getElementById('tabNav').innerHTML = '';
        }

        function startSessionTimer() {
            if (sessionTimeout) clearTimeout(sessionTimeout);
            sessionTimeout = setTimeout(() => {
                showToast('⚠️ Sitzung abgelaufen (30 Min. Inaktivität)', 'warning');
                setTimeout(() => doLogout(), 1500);
            }, SESSION_DURATION);
        }

        function resetSessionTimer() {
            if (sessionTimeout) { clearTimeout(sessionTimeout);
                startSessionTimer(); }
            const sessionStr = localStorage.getItem('navySession');
            if (sessionStr) {
                try {
                    const data = JSON.parse(sessionStr);
                    data.expiry = Date.now() + SESSION_DURATION;
                    localStorage.setItem('navySession', JSON.stringify(data));
                } catch (error) {}
            }
        }
        ['click', 'keypress', 'scroll', 'mousemove'].forEach(event => {
            document.addEventListener(event, resetSessionTimer);
        });

        // =====================================================================
        // TAB SYSTEM
        // =====================================================================
        function updateTabs() {
            const tabNav = document.getElementById('tabNav');
            tabNav.innerHTML = '';

            const tabs = [
                { id: 'home', icon: 'fa-home', label: 'Hauptseite' },
                { id: 'stopwatch', icon: 'fa-stopwatch', label: 'Stoppuhr' },
                { id: 'interessenten', icon: 'fa-phone', label: 'Interessenten' },
                { id: 'confiscations', icon: 'fa-clipboard-list', label: 'Beschlagn.' },
                { id: 'payout', icon: 'fa-money-bill-wave', label: 'Auszahlung' },
                { id: 'elk', icon: 'fa-clipboard-check', label: 'ELK' },
                { id: 'logs', icon: 'fa-history', label: 'Logs' },
                { id: 'admin', icon: 'fa-shield-alt', label: 'Admin' }
            ];

            for (const tab of tabs) {
                let visible = true;
                if (tab.id === 'admin' && userPermissions.admin !== 'write') visible = false;
                if (tab.id === 'stopwatch' && !userPermissions.stopwatch?.view && !userPermissions.stopwatch?.create) visible =
                    false;
                if (tab.id === 'interessenten' && !userPermissions.interessenten?.view) visible = false;
                if (tab.id === 'confiscations' && !userPermissions.confiscations?.view) visible = false;
                if (tab.id === 'payout' && !userPermissions.payout?.view) visible = false;
                if (tab.id === 'elk' && !userPermissions.elk?.view) visible = false;
                if (tab.id === 'logs' && !userPermissions.logs?.view) visible = false;

                if (visible) {
                    const btn = document.createElement('button');
                    btn.className = 'tab-btn' + (tab.id === 'admin' ? ' admin-tab' : '');
                    btn.innerHTML = `<i class="fas ${tab.icon} tab-icon"></i> ${tab.label}`;
                    btn.onclick = () => switchTab(tab.id);
                    btn.dataset.tab = tab.id;
                    if (tab.id === 'home') btn.classList.add('active');
                    tabNav.appendChild(btn);
                }
            }
        }

        async function switchTab(name) {
            if (name === 'admin' && userPermissions.admin !== 'write') {
                showToast('Keine Admin-Berechtigung!', 'error');
                return;
            }

            // Prüfe Berechtigungen für den Tab
            if (name !== 'home' && name !== 'admin') {
                let visible = false;
                if (name === 'stopwatch') visible = userPermissions.stopwatch?.view === 'read' || userPermissions.stopwatch
                    ?.create === 'write';
                else if (name === 'interessenten') visible = userPermissions.interessenten?.view === 'read';
                else if (name === 'confiscations') visible = userPermissions.confiscations?.view === 'read';
                else if (name === 'payout') visible = userPermissions.payout?.view === 'read';
                else if (name === 'elk') visible = userPermissions.elk?.view === 'read';
                else if (name === 'logs') visible = userPermissions.logs?.view === 'read';
                if (!visible) { showToast('Keine Berechtigung für diesen Bereich!', 'error'); return; }
            }

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            const tabEl = document.getElementById('tab-' + name);
            if (tabEl) {
                tabEl.classList.add('active');
                if (name === 'admin') tabEl.style.display = 'block';
            }

            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.tab === name) btn.classList.add('active');
            });

            // Tab-Inhalt laden (nur wenn nicht Home)
            if (name !== 'home') {
                await loadTabContent(name);
            } else {
                await loadHomeContent();
            }

            // Tab-spezifische Initialisierung
            if (name === 'stopwatch') {
                if (typeof initStopwatch === 'function') initStopwatch();
            } else if (name === 'interessenten') {
                if (typeof initInteressenten === 'function') initInteressenten();
            } else if (name === 'confiscations') {
                if (typeof initConfiscations === 'function') initConfiscations();
            } else if (name === 'payout') {
                if (typeof initPayout === 'function') initPayout();
            } else if (name === 'elk') {
                if (typeof initElk === 'function') initElk();
            } else if (name === 'logs') {
                if (typeof initLogs === 'function') initLogs();
            } else if (name === 'admin') {
                if (typeof initAdmin === 'function') initAdmin();
            }
        }

        async function loadTabContent(name) {
            const tabEl = document.getElementById('tab-' + name);
            if (!tabEl) return;

            // Prüfen ob Inhalt schon geladen wurde
            if (tabEl.dataset.loaded === 'true') return;

            try {
                const response = await fetch(name + '.html');
                if (!response.ok) throw new Error('Datei nicht gefunden');
                const html = await response.text();
                tabEl.innerHTML = html;
                tabEl.dataset.loaded = 'true';
            } catch (error) {
                console.error('Fehler beim Laden von ' + name + '.html:', error);
                tabEl.innerHTML =
                    `<div style="text-align:center;padding:40px;color:#8f9499;"><i class="fas fa-exclamation-triangle" style="font-size:40px;display:block;margin-bottom:12px;"></i><p>Fehler beim Laden des Inhalts.</p><p style="font-size:12px;">${name}.html wurde nicht gefunden.</p></div>`;
            }
        }

        async function loadHomeContent() {
            const tabEl = document.getElementById('tab-home');
            if (!tabEl) return;
            if (tabEl.dataset.loaded === 'true') return;

            // Home-Inhalt wird direkt hier generiert
            const html = `
                <div class="homepage">
                    <img src="https://cdn.phototourl.com/free/2026-07-09-c1b8a06d-a213-4a8a-a938-ef9afda7bba5.png" alt="Navy Logo">
                    <h1>U.S NAVY MARINE</h1>
                    <p class="subtitle">⚓ Verwaltungssystem ⚓</p>
                    <p class="welcome-user">Willkommen, <span id="welcomeName">${currentUser ? getDisplayName(currentUser.username) : ''}</span>!</p>
                    <div class="handbook-section">
                        <h3><i class="fas fa-compass"></i> Kurzanleitung: Was siehst du?</h3>
                        <p style="color:#8f9499;font-size:13px;margin-bottom:12px;">
                            Je nach deiner Rolle siehst du unterschiedliche Bereiche im System.
                            ${userPermissions.admin === 'write' ? '<span style="color:#22c55e;font-weight:bold;">ADMIN hat alle Rechte.</span>' : ''}
                        </p>
                        <div class="handbook-grid" id="handbookGrid"></div>
                    </div>
                </div>
            `;
            tabEl.innerHTML = html;
            tabEl.dataset.loaded = 'true';
            renderHandbook();
        }

        function renderHandbook() {
            const grid = document.getElementById('handbookGrid');
            if (!grid) return;

            const categories = [];
            if (userPermissions.stopwatch?.view === 'read' || userPermissions.stopwatch?.create === 'write') {
                categories.push({ icon: '⏱️', name: 'Stoppuhr', desc: 'Hier kannst du Zeiten für verschiedene Boote stoppen und speichern. Du siehst deine eigenen Zeiten und die Durchschnittszeiten aller Soldaten.' });
            }
            if (userPermissions.interessenten?.view === 'read') {
                categories.push({ icon: '📞', name: 'Interessenten', desc: 'Verwalte alle Interessenten mit Name, Telefon und Notiz. Du kannst Einträge hinzufügen, bearbeiten, archivieren und löschen.' });
            }
            if (userPermissions.confiscations?.view === 'read') {
                categories.push({ icon: '📋', name: 'Beschlagnahmungen', desc: 'Verwalte alle beschlagnahmten Gegenstände und Geldbeträge. Du kannst neue Einträge erstellen, bearbeiten und löschen.' });
            }
            if (userPermissions.payout?.view === 'read') {
                categories.push({ icon: '💰', name: 'Auszahlung', desc: 'Hier siehst du die wöchentlichen Auszahlungen für alle sichtbaren Benutzer. Du kannst Kontrollen zählen und Auszahlungen als "bezahlt" markieren.' });
            }
            if (userPermissions.elk?.view === 'read') {
                categories.push({ icon: '📋', name: 'ELK', desc: 'Verwalte die Einsatzpunkte mit einem einfachen Toggle-System. Jeder Punkt kann aktiviert oder deaktiviert werden.' });
            }
            if (userPermissions.logs?.view === 'read') {
                categories.push({ icon: '📊', name: 'Logs', desc: 'Zeige alle Aktivitäten im System an. Du kannst nach Benutzern filtern oder alle Logs der letzten 100 Einträge sehen.' });
            }
            if (userPermissions.admin === 'write') {
                categories.push({ icon: '🔑', name: 'Admin-Bereich', desc: 'Hier verwaltest du Benutzer, Rollen, Berechtigungen, Boote und ELK-Felder. Nur für Administratoren sichtbar.' });
            }

            if (categories.length === 0) {
                grid.innerHTML = '<p style="color:#8f9499;grid-column:1/-1;text-align:center;">Keine Bereiche für dich sichtbar.</p>';
                return;
            }

            grid.innerHTML = categories.map(cat => `
                <div class="category-card">
                    <div><span class="cat-icon">${cat.icon}</span><span class="cat-name">${cat.name}</span></div>
                    <div class="cat-desc">${cat.desc}</div>
                </div>
            `).join('');
        }

        // =====================================================================
        // INITIALISIERUNG
        // =====================================================================
        async function init() {
            try {
                await cleanupOldLogs();
                await loadRolesFromFirebase();

                try {
                    const colinCheck = await database.ref('Navy-boote/users_auth/colin').once('value');
                    if (colinCheck.exists()) {
                        await database.ref('Navy-boote/users_auth/colin').remove();
                        console.log('✅ Colin wurde beim Start gelöscht');
                    }
                } catch (e) {}

                await updateAllUsernameLists();

                const autoLoggedIn = await tryAutoLogin();
                if (!autoLoggedIn) {
                    document.getElementById('loginScreen').classList.remove('hidden');
                    document.getElementById('mainApp').classList.remove('show');
                }

                console.log('🚀 System initialisiert - NUR ADMIN Rolle!');
                console.log('🔒 Colin ist permanent gesperrt!');
                console.log('📁 Tabs werden per fetch geladen!');
            } catch (error) {
                console.error('Init-Fehler:', error);
            }
        }

        init();
    </script>

</body>
